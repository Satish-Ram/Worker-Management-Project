<div class="container mt-4">
    <h2>Edit Worker</h2>
    <form (ngSubmit)="updateWorker()">
        <div class="mb-3">
            <label class="form-label">Worker Name</label>
            <input type="text"
                    class="form-control"
                    [(ngModel)]="worker.workerName"
                    name="workerName"
                    required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mobile</label>
            <input type="text"
                    class="form-control"
                    [(ngModel)]="worker.mobile"
                    name="mobile"
                    required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text"
                    class="form-control"
                    [(ngModel)]="worker.address"
                    name="address"
                    required>
        </div>
        <div class="mb-3">
            <label class="form-label">Site Name</label>
            <input type="text"
                    class="form-control"
                    [(ngModel)]="worker.siteName"
                    name="siteName"
                    required>
        </div>
        <div class="mb-3">
            <label class="form-label">Worker Name</label>
            <input type="text"
                    class="form-control"
                    [(ngModel)]="worker.workerName"
                    name="workerName"
                    required>
        </div>
        <div class="mb-3">
            <label class="form-label">Daily Wage</label>
            <input type="number"
                    class="form-control"
                    [(ngModel)]="worker.dailyWage"
                    name="dailyWage"
                    required>
        </div>
        <div class="mb-3">
            <label class="form-label">joining Date</label>
            <input type="date"
                    class="form-control"
                    [(ngModel)]="worker.joiningDate"
                    name="joiningDate"
                    required>
        </div>
        <button type="submit" class="btn btn-success">Edit Worker</button>
    </form>
    
</div>
