<div class="container mt-4">
  
  <h2>Add Worker</h2>

  <form (ngSubmit)="addWorker()">
    <div class="mb-3">
      <label class="form-label"> Worker Name </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="worker.workerName"
        name="workerName"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label"> Mobile </label>

      <input type="text" class="form-control" [(ngModel)]="worker.mobile" name="mobile" />
    </div>

    <div class="mb-3">
      <label class="form-label"> Address </label>

      <textarea class="form-control" [(ngModel)]="worker.address" name="address"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label"> Daily Wage </label>

      <input type="number" class="form-control" [(ngModel)]="worker.dailyWage" name="dailyWage" />
    </div>

    <div class="mb-3">
      <label class="form-label"> Site Name </label>

      <input type="text" class="form-control" [(ngModel)]="worker.siteName" name="siteName" />
    </div>

    <div class="mb-3">
      <label class="form-label"> Joining Date </label>

      <input type="date" class="form-control" [(ngModel)]="worker.joiningDate" name="joiningDate" />
    </div>

    <button type="submit" class="btn btn-success">Save Worker</button>
  </form>
</div>
